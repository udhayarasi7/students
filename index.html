<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management & AI Portal</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { color: #333; text-align: center; }
        .chat-box { border: 1px solid #ddd; height: 400px; overflow-y: auto; padding: 15px; border-radius: 8px; background: #fafafa; margin-bottom: 15px; display: flex; flex-direction: column; }
        .message { margin-bottom: 10px; padding: 10px 14px; border-radius: 8px; max-width: 75%; word-wrap: break-word; line-height: 1.4; }
        .user { background: #007bff; color: white; align-self: flex-end; }
        .bot { background: #e9ecef; color: #333; align-self: flex-start; }
        .input-group { display: flex; gap: 10px; }
        input[type="text"] { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; outline: none; }
        input[type="text"]:focus { border-color: #007bff; }
        button { padding: 12px 24px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; }
        button:hover { background: #218838; }
        button:disabled { background: #6c757d; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="container">
    <h2>🎓 Student AI Chatbot Portal</h2>
    <div class="chat-box" id="chatBox">
        <div class="message bot">Hello! Ask me anything about the student database (e.g., GPA, interests, department).</div>
    </div>
    <div class="input-group">
        <input type="text" id="userInput" placeholder="Ask e.g. Who is interested in robotics?" onkeypress="handleKeyPress(event)">
        <button id="sendBtn" onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    function handleKeyPress(event) {
        if (event.key === 'Enter') {
            sendMessage();
        }
    }

    async function sendMessage() {
        const inputField = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const chatBox = document.getElementById('chatBox');
        const query = inputField.value.trim();

        if (!query) return;

        // Display user message
        chatBox.innerHTML += `<div class="message user">${escapeHtml(query)}</div>`;
        inputField.value = '';
        chatBox.scrollTop = chatBox.scrollHeight;

        // Disable input while processing
        inputField.disabled = true;
        sendBtn.disabled = true;

        // Add temporary typing indicator
        const loadingId = 'loading-' + Date.now();
        chatBox.innerHTML += `<div class="message bot" id="${loadingId}"><i>Thinking...</i></div>`;
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            const response = await fetch('http://localhost:8000/api/v1/chat/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: query })
            });

            const data = await response.json();
            
            // Remove loading indicator & show response
            document.getElementById(loadingId).remove();
            const botReply = data.response || data.answer || data.detail || JSON.stringify(data);
            chatBox.innerHTML += `<div class="message bot">${botReply}</div>`;

        } catch (error) {
            document.getElementById(loadingId).remove();
            chatBox.innerHTML += `<div class="message bot" style="color: red;">Error connecting to API server. Ensure Docker/FastAPI server is running.</div>`;
        } finally {
            inputField.disabled = false;
            sendBtn.disabled = false;
            inputField.focus();
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    }

    function escapeHtml(text) {
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
</script>

</body>
</html>
